variables:
  - &devcon 'ghcr.io/windsource/picus-devcontainer:1.2.1'
  - &buildx_plugin 'woodpeckerci/plugin-docker-buildx@sha256:765ebfaa6f71383197babb2352c7902bafe141e6232a62cafb740510a788c550' # 6.0.4

labels:
  platform: linux/amd64

clone:
  git:
    image: woodpeckerci/plugin-git@sha256:e6326a142d9bf08c6cc79cee3b3b26c87c15c999f89fb0b14c98d6031639968a # 2.8.1
    when:
      - event: pull_request
      - event: [push, tag, manual]
        branch: main

steps:
  - name: build-dev-container
    image: *buildx_plugin
    settings:
      repo: ghcr.io/windsource/picus-devcontainer
      dockerfile: .devcontainer/Dockerfile
      context: .devcontainer
      tags_file: .devcontainer/VERSION
      logins:
        - registry: https://ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_password
    when:
      - path:
          - ".devcontainer/*"
          - ".woodpecker.yml"
        event: [push, manual]
        branch: main  
      - path:
          - ".devcontainer/*"
          - ".woodpecker.yml"
        event: pull_request

    # The license check has to before the vendor command as otherweise 'cargo install' will not work
  - name: check-licenses
    image: *devcon
    commands: 
      - just check-licenses
    when:
      - event: pull_request
      - event: [push, tag, manual]
        branch: main

  - name: vendor
    image: *devcon
    commands:
      - just vendor
    when:
      - event: tag

  - name: build-x86
    image: *devcon
    commands:
      - just test
      - just build-amd64
    when:
      - event: pull_request
      - event: [push, tag, manual]
        branch: main

  - name: build-arm64
    image: *devcon
    commands:
      - just build-arm64
    when:
      - event: pull_request
      - event: [push, tag, manual]
        branch: main

  - name: checksum
    image: *devcon
    commands:
      - just checksum
    when:
      - event: tag

  - name: publish-distroless
    image: *buildx_plugin
    settings:
      platforms: linux/amd64,linux/arm64
      repo: windsource/picus,ghcr.io/windsource/picus
      auto_tag: true
      default_suffix: "distroless"
      dockerfile: Dockerfile.distroless.multiarch
      # dry_run: true
      logins:
        - registry: https://index.docker.io/v1/
          username:
            from_secret: docker_username
          password:
            from_secret: docker_password
        - registry: https://ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_password
    when:
      event: [push, tag, manual]
      branch: main

  - name: publish-debian
    image: *buildx_plugin
    settings:
      platforms: linux/amd64,linux/arm64
      repo: windsource/picus,ghcr.io/windsource/picus
      auto_tag: true
      dockerfile: Dockerfile.multiarch
      # dry_run: true
      logins:
        - registry: https://index.docker.io/v1/
          username:
            from_secret: docker_username
          password:
            from_secret: docker_password
        - registry: https://ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_password
    when:
      event: [push, tag, manual]
      branch: main

  - name: publish-release
    image: woodpeckerci/plugin-release@sha256:48a9ce5e4b82bb45098f51296d6232e68d58204d1edd46cc793a1458481f0584 # 0.3.0
    settings:
      files:
        - 'dist/*'
      api_key:
        from_secret: github_password
      title: ${CI_COMMIT_TAG##v}
    when:
      - event: tag
      